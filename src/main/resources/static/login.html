
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Dating App</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffe6f0;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-card {
            background: white;

            width: 350px;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);

            text-align: center;
        }

        h1 {
            color: #e91e63;

            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 12px;

            margin: 10px 0;

            border: 1px solid #ccc;

            border-radius: 8px;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            padding: 12px;

            margin-top: 15px;

            border: none;

            border-radius: 8px;

            background: #e91e63;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #c2185b;
        }

        #message {
            margin-top: 15px;
        }

        .register-link {
            margin-top: 20px;
        }

        .register-link a {
            color: #e91e63;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-card">

    <h1>Welcome Back ❤️</h1>

    <form id="loginForm">

        <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

        <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required>

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>


<script>

    document.getElementById("loginForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            try {

                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const result = await response.json().catch(() => ({}));

                if (response.ok) {

                    sessionStorage.setItem("userEmail", result.email);
                    sessionStorage.setItem("userName", result.name);

                    document.getElementById("message").innerText =
                        "Login successful ❤️ Redirecting...";

                    setTimeout(function () {
                        window.location.href = "home.html";
                    }, 800);

                } else {

                    document.getElementById("message").innerText =
                        result.error || "Login failed ❌";

                }

            } catch (error) {

                console.error(error);

                document.getElementById("message").innerText =
                    "Something went wrong ❌";

            }

        });

</script>

</body>

</html>
