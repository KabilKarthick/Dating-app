
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Dating App</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffe6f0;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .register-card {
            background: white;

            width: 350px;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);

            text-align: center;
        }

        h1 {
            color: #e91e63;

            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 12px;

            margin: 10px 0;

            border: 1px solid #ccc;

            border-radius: 8px;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            padding: 12px;

            margin-top: 15px;

            border: none;

            border-radius: 8px;

            background: #e91e63;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #c2185b;
        }

        #message {
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="register-card">

    <h1>Create Account ❤️</h1>

    <form id="registerForm">

        <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required>

        <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

        <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required>

        <button type="submit">
            Register
        </button>

    </form>

    <p id="message"></p>

</div>


<script>

    const registerError = new URLSearchParams(window.location.search).get("error");
    if (registerError === "please-register") {
        document.getElementById("message").innerText =
            "Please create your account first to accept the invitation ❤️";
    }

    document.getElementById("registerForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const name =
                document.getElementById("name").value;

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;


            try {

                const response = await fetch("/save/user", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        name: name,
                        email: email,
                        password: password

                    })

                });


                const result = await response.json();


                if (response.ok) {

                    document.getElementById("message").innerText =
                        "Registration successful ❤️ Redirecting to login...";

                    document.getElementById("registerForm")
                        .reset();

                    setTimeout(function () {
                        window.location.href = "login.html";
                    }, 1200);

                } else {

                    const data = await response.json().catch(() => ({}));

                    document.getElementById("message").innerText =
                        data.error || "Registration failed ❌";

                    console.log(data);

                }

            } catch (error) {

                console.error(error);

                document.getElementById("message").innerText =
                    "Something went wrong ❌";

            }

        });

</script>

</body>

</html>
